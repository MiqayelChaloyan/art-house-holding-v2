# Nginx config for arthouse.am — apply on the production server.
# Fixes GSC "Blocked due to other 4xx" for http://arthouse.am:443/ (nginx error 497/400).
#
# Install:
#   sudo cp deploy/nginx-arthouse.conf /etc/nginx/sites-available/arthouse.am
#   sudo ln -sf /etc/nginx/sites-available/arthouse.am /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

# HTTP (port 80) → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name arthouse.am www.arthouse.am;
    return 301 https://arthouse.am$request_uri;
}

# HTTPS (port 443)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name arthouse.am www.arthouse.am;

    # Plain HTTP sent to port 443 → redirect to HTTPS (fixes http://arthouse.am:443/ 400)
    error_page 497 =301 https://arthouse.am$request_uri;

    ssl_certificate     /etc/letsencrypt/live/arthouse.am/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arthouse.am/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
